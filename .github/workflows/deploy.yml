name: Pubblica siti su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Prepara pubblicazione
        run: |
          mkdir -p _site
          cp -a ABSTRKT/. _site/
          mkdir -p _site/arianna-max
          cp -a arianna-max/. _site/arianna-max/

      - name: Carica siti
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Pubblica sito
        id: deployment
        uses: actions/deploy-pages@v4
